# Tự động build và đưa app lên GitHub Pages mỗi khi đẩy mã lên nhánh main.
name: Đưa lên GitHub Pages

on:
  push:
    branches: [main]
  # Cho phép bấm chạy tay từ tab Actions, dùng khi cần build lại mà không sửa mã.
  workflow_dispatch:

# Quyền tối thiểu để đẩy lên Pages. GITHUB_TOKEN chỉ được cấp đúng những quyền
# này, không hơn.
permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ cho một lượt triển khai chạy tại một thời điểm. Đẩy hai lần liên tiếp thì
# lượt sau chờ lượt trước xong, để không có hai bản cùng ghi đè lên nhau.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Flutter
        uses: subosito/flutter-action@v2
        with:
          # PHẢI khớp với phiên bản đang dùng ở máy phát triển. Để "stable" thì
          # một bản Flutter mới ra là bản build trên máy chủ khác hẳn máy mình,
          # lỗi xảy ra sẽ rất khó truy.
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Tải các gói phụ thuộc
        run: flutter pub get

      - name: Sinh mã cho Hive
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Soát tĩnh
        run: flutter analyze

      - name: Chạy kiểm thử
        run: flutter test

      # Hai tham số dưới đây đều BẮT BUỘC, thiếu cái nào cũng hỏng:
      #
      #   --no-web-resources-cdn : không có thì CanvasKit và font Roboto tải từ
      #     gstatic.com, service worker không cache được (khác miền) nên app
      #     không chạy offline thật.
      #
      #   --base-href /leitner_app/ : GitHub Pages đặt app trong thư mục con
      #     theo tên kho. Thiếu tham số này thì mọi đường dẫn trỏ về gốc tên
      #     miền và app ra TRANG TRẮNG.
      #     Đổi tên kho thì phải sửa lại đúng tên mới ở đây.
      - name: Build web
        run: flutter build web --no-web-resources-cdn --base-href /leitner_app/

      # Đóng dấu mã build vào service worker và trang chủ.
      #
      # BƯỚC NÀY BẮT BUỘC, đừng bỏ. Không có nó thì nội dung `sw.js` giống hệt
      # nhau qua mọi lần build, trình duyệt coi service worker không đổi nên
      # KHÔNG cài lại — và người dùng kẹt vĩnh viễn ở bản cũ. Đã xảy ra thật.
      #
      # Dấu gồm mã commit rút gọn và ngày giờ build, để nhìn là biết ngay máy
      # đang chạy bản nào.
      - name: Đóng dấu mã build
        run: |
          VERSION="${GITHUB_SHA::7}-$(date -u +%Y%m%d.%H%M)"
          echo "Mã build: $VERSION"
          sed -i "s/__BUILD_VERSION__/$VERSION/g" build/web/sw.js
          sed -i "s/__BUILD_VERSION__/$VERSION/g" build/web/index.html
          # Kiểm chứng ngay tại đây: còn sót chuỗi thay thế nào là hỏng cơ chế
          # cập nhật, phải dừng workflow chứ không được đẩy lên.
          if grep -q "__BUILD_VERSION__" build/web/sw.js build/web/index.html; then
            echo "LỖI: vẫn còn __BUILD_VERSION__ chưa được thay"
            exit 1
          fi
          grep -o "leitner-[a-f0-9]\{7\}-[0-9.]*" build/web/sw.js | head -1

      - name: Chuẩn bị trang cho Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói thư mục build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Triển khai
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Đưa lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
