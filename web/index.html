<!DOCTYPE html>
<html lang="vi">
<head>
  <!--
    Đường dẫn gốc khi phục vụ app. `flutter build web` sẽ thay chỗ này bằng giá
    trị của tham số --base-href. Đặt app ở thư mục con thì phải truyền tham số
    đó, nếu không service worker sẽ đăng ký nhầm phạm vi và app không chạy
    offline được.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Học từ vựng tiếng Anh theo phương pháp Leitner 5 hộp. Chạy hoàn toàn trên máy bạn, học được khi không có mạng.">

  <!-- Màu thanh trạng thái, khớp với màu chủ đạo trong lib/app.dart -->
  <meta name="theme-color" content="#2E6F5E">

  <!-- Thẻ dành riêng cho iOS: Safari không đọc manifest.json cho phần này -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Leitner">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Leitner — Học từ vựng</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Máy đo phải chạy TRƯỚC mọi thứ khác, vì nó cần bắt được cả những lỗi xảy
    // ra trong lúc Flutter đang nạp — lúc đó chưa có màn hình nào để hiện lỗi.
    // Trên điện thoại không mở được console nên đây là cách duy nhất thấy lỗi.
    window.__leitner = {
      mocMoTrang: Date.now(),
      khungDauTien_ms: null,
      loiJS: [],
      // Khâu triển khai thay chuỗi này bằng mã commit thật. Còn nguyên nghĩa là
      // bản chạy ở máy phát triển, chưa qua triển khai.
      phienBan: '__BUILD_VERSION__',
      // Bật lên khi phát hiện có bản mới đã tải xong và sẵn sàng thay thế.
      coBanMoi: false,

      // Phần đuôi địa chỉ NGAY LÚC MỞ TRANG.
      //
      // Bắt buộc phải chụp lại ở đây. Flutter web quản lý địa chỉ bằng phần
      // hash và GHI ĐÈ nó thành '#/' ngay khi khởi động, nên tới lúc mã Dart
      // chạy thì '#debug' đã bị xoá mất. Đó chính là lý do màn hình chẩn đoán
      // không mở được bằng đường '#debug'.
      hashBanDau: window.location.hash,

      // Cách app đang được mở. Đây là mấu chốt của cả lần điều tra này: mở bằng
      // trình duyệt thì chạy tốt, mở từ biểu tượng ngoài màn hình chính thì đơ.
      cheDoHienThi: (function () {
        try {
          if (window.matchMedia('(display-mode: standalone)').matches) return 'standalone';
          if (window.matchMedia('(display-mode: fullscreen)').matches) return 'fullscreen';
          if (window.matchMedia('(display-mode: minimal-ui)').matches) return 'minimal-ui';
          if (window.navigator.standalone === true) return 'standalone-ios';
          return 'browser';
        } catch (e) { return 'khong ro'; }
      })()
    };

    // Khoá lưu lỗi bền vững.
    //
    // Dải báo lỗi trong app chỉ hiện được khi app còn vẽ nổi. Nếu sự cố xảy ra
    // sớm tới mức app chết trước khung hình đầu tiên thì chẳng còn gì để hiện.
    // Vì vậy lỗi được ghi thêm vào kho của trình duyệt, để lần mở sau vẫn đọc
    // lại được — ở chế độ standalone thì đây là cách duy nhất thấy lỗi.
    var __KHOA_LOI = 'leitner_loi';

    function __docLoiCu() {
      try {
        var raw = window.localStorage.getItem(__KHOA_LOI);
        return raw ? JSON.parse(raw) : [];
      } catch (e) { return []; }
    }

    function __ghiLoi(nguon, thongDiep, chiTiet) {
      // Giữ tối đa 20 lỗi: điện thoại yếu mà lỗi lặp vô hạn thì chính mảng này
      // sẽ ăn hết bộ nhớ.
      if (window.__leitner.loiJS.length >= 20) return;
      var muc = {
        luc: Date.now() - window.__leitner.mocMoTrang,
        nguon: nguon,
        thongDiep: String(thongDiep).slice(0, 300),
        chiTiet: chiTiet ? String(chiTiet).slice(0, 300) : null,
        cheDo: window.__leitner.cheDoHienThi,
        phienBan: window.__leitner.phienBan
      };
      window.__leitner.loiJS.push(muc);
      try {
        var cu = __docLoiCu();
        cu.push(muc);
        // Chỉ giữ 30 lỗi gần nhất qua các phiên, đủ để lần ngược mà không phình.
        window.localStorage.setItem(__KHOA_LOI, JSON.stringify(cu.slice(-30)));
      } catch (e) { /* hết chỗ lưu thì thôi, không được để việc ghi lỗi gây lỗi */ }

      // Báo NGAY cho ứng dụng thay vì để nó hỏi lại theo nhịp.
      //
      // Trước đây dải báo lỗi cứ hai giây lại hỏi một lần. Cách đó vừa phí vừa
      // khiến ứng dụng không bao giờ thật sự rảnh: cứ đúng nhịp là luồng chính
      // lại bị đánh thức. Đẩy tin sang thì chỉ chạy đúng lúc có việc.
      try {
        if (typeof window.__leitnerBaoLoi === 'function') window.__leitnerBaoLoi();
      } catch (e) {}
    }

    /// Lỗi của những phiên trước, đọc lại từ kho.
    window.__leitner.loiPhienTruoc = __docLoiCu();

    /// Cho phép app xoá nhật ký lỗi sau khi người dùng đã xem.
    window.__leitnerXoaLoi = function () {
      try { window.localStorage.removeItem(__KHOA_LOI); } catch (e) {}
      window.__leitner.loiJS = [];
      window.__leitner.loiPhienTruoc = [];
    };

    window.addEventListener('error', function (e) {
      __ghiLoi('window.onerror', e.message, e.filename + ':' + e.lineno);
    });
    window.addEventListener('unhandledrejection', function (e) {
      __ghiLoi('promise', e.reason && e.reason.message ? e.reason.message : e.reason, null);
    });

    // Flutter bắn sự kiện này khi vẽ xong khung hình đầu tiên.
    window.addEventListener('flutter-first-frame', function () {
      if (window.__leitner.khungDauTien_ms === null) {
        window.__leitner.khungDauTien_ms = Date.now() - window.__leitner.mocMoTrang;
      }
    });
  </script>

  <style>
    /* Nền của trang trước khi Flutter vẽ xong, để không loé trắng rồi mới đổi
       màu. Hai giá trị khớp với background_color trong manifest và với bảng màu
       tối của ứng dụng. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F5FAF7;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #101512; }
    }
    /* Màn hình chờ trong lúc tải gói ứng dụng lần đầu. */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #2E6F5E;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="loading">Đang tải…</div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Gỡ màn hình chờ khi Flutter đã dựng xong khung hình đầu tiên.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });

    // Đăng ký service worker riêng. Phải tự làm ở đây vì Flutter đã bỏ service
    // worker của nó — xem chú thích đầu file web/sw.js.
    //
    // Đăng ký sau sự kiện 'load' để việc nạp sẵn tài nguyên của service worker
    // không giành băng thông với lần tải đầu tiên của chính ứng dụng.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('sw.js', {
            // BẮT BUỘC. Không có tuỳ chọn này, trình duyệt được phép lấy chính
            // file sw.js từ bộ nhớ đệm HTTP, nên có thể mất tới một ngày mới
            // nhận ra có bản mới. Đây đúng là cái bẫy đã khiến người dùng kẹt
            // ở bản cũ.
            updateViaCache: 'none'
          })
          .then(function (reg) {
            // Chủ động hỏi máy chủ xem có bản mới không, ngay mỗi lần mở app.
            reg.update().catch(function () {});

            // Có bản mới đang được cài: theo dõi cho tới lúc nó sẵn sàng.
            reg.addEventListener('updatefound', function () {
              var moi = reg.installing;
              if (!moi) return;
              moi.addEventListener('statechange', function () {
                // `controller` khác null nghĩa là trang đang được một service
                // worker cũ phục vụ — tức đây là một bản CẬP NHẬT, không phải
                // lần cài đầu tiên. Chỉ khi đó mới cần mời người dùng tải lại.
                if (moi.state === 'installed' && navigator.serviceWorker.controller) {
                  window.__leitner.coBanMoi = true;
                  try {
                    if (typeof window.__leitnerBaoCapNhat === 'function') {
                      window.__leitnerBaoCapNhat();
                    }
                  } catch (e) {}
                }
              });
            });
          })
          .catch(function (error) {
            console.warn('Không đăng ký được service worker:', error);
          });

        // Service worker mới đã chiếm quyền điều khiển. Trang hiện tại vẫn đang
        // chạy mã cũ đã nạp từ trước, nên phải tải lại mới thấy bản mới.
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          window.__leitner.coBanMoi = true;
          try {
            if (typeof window.__leitnerBaoCapNhat === 'function') {
              window.__leitnerBaoCapNhat();
            }
          } catch (e) {}
        });
      });
    }
  </script>
</body>
</html>
